name: Build check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Print Java version
        run: java -version
      - name: Ensure gradlew executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
